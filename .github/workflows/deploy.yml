name: Deploy to ArenHost

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Izinkan deploy manual dari tab Actions GitHub

jobs:
  # ============================================================
  # JOB 1: Validasi PHP sebelum deploy
  # ============================================================
  pre-deploy-check:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Lint PHP syntax
        run: |
          echo "=== PHP Lint sebelum deploy ==="
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find app/ public/ -name "*.php" -print0)
          if [ -f "migrate.php" ]; then
            if ! php -l migrate.php > /dev/null 2>&1; then
              php -l migrate.php
              ERRORS=$((ERRORS+1))
            fi
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "ERROR: $ERRORS file PHP memiliki syntax error. Deploy dibatalkan."
            exit 1
          fi
          echo "=== Semua file PHP valid ==="

      - name: Pastikan .env tidak ter-commit
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: File .env ditemukan di repository. Deploy dibatalkan."
            echo "Jalankan: git rm --cached .env"
            exit 1
          fi
          echo "[OK] .env tidak ada di repository"

  # ============================================================
  # JOB 2: Deploy via SSH ke ArenHost
  # Catatan: Job ini akan SKIP (bukan FAIL) jika secrets belum
  # dikonfigurasi. Tambahkan secrets setelah hosting dibeli.
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    # environment: production  # Uncomment setelah secrets dikonfigurasi di GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cek konfigurasi secrets
        id: secrets_check
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️  GitHub Secret HOST belum dikonfigurasi."
            echo "   Deployment di-skip. Tambahkan secrets berikut setelah hosting dibeli:"
            echo "   - HOST          : hostname atau IP server"
            echo "   - USERNAME      : username SSH hosting"
            echo "   - SSH_PRIVATE_KEY: private key untuk koneksi SSH"
            echo "   - PORT          : port SSH (biasanya 22)"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets terdeteksi, melanjutkan deployment."
          fi

      - name: Deploy via SSH
        if: steps.secrets_check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.HOST }}
          username:    ${{ secrets.USERNAME }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.PORT }}
          script_stop: true

          script: |
            echo "=== Memulai Deployment ==="
            echo "Waktu: $(date)"
            echo "Host: $(hostname)"

            # Navigasi ke direktori project
            cd /home/${{ secrets.USERNAME }}/fashiontrendknn || {
              echo "ERROR: Direktori project tidak ditemukan!"
              echo "Pastikan sudah menjalankan git clone terlebih dahulu."
              echo "  git clone git@github.com:REPO /home/${{ secrets.USERNAME }}/fashiontrendknn"
              exit 1
            }

            echo "=== Direktori aktif: $(pwd) ==="

            # Pastikan ini adalah git repository yang valid
            if [ ! -d ".git" ]; then
              echo "ERROR: Bukan git repository. Jalankan git clone terlebih dahulu."
              exit 1
            fi

            # Periksa status git
            echo "=== Status Git ==="
            git status --short

            # Ambil update dari remote
            echo "=== Git Fetch ==="
            git fetch origin main

            # Pull dengan ff-only — gagal jika ada konflik lokal (aman)
            echo "=== Git Pull (ff-only) ==="
            git pull --ff-only origin main || {
              echo "ERROR: git pull --ff-only gagal."
              echo "Mungkin ada perubahan lokal di server yang konflik."
              echo "Periksa server secara manual sebelum deploy ulang."
              exit 1
            }

            echo "=== Commit terbaru ==="
            git log -1 --pretty=format:"Commit: %H%nAuthor: %an%nDate:   %ai%nMessage: %s"
            echo ""

            # Pastikan .env ada di server
            if [ ! -f ".env" ]; then
              echo "ERROR: File .env tidak ditemukan di server!"
              echo "Buat .env dari template: cp .env.example .env && nano .env"
              exit 1
            fi

            # Pastikan folder storage ada dan writable
            mkdir -p storage/logs
            mkdir -p storage/uploads
            chmod 755 storage/logs
            chmod 755 storage/uploads

            echo ""
            echo "=== Deployment Selesai ==="
            echo "Waktu: $(date)"

      - name: Ringkasan deployment
        if: steps.secrets_check.outputs.configured == 'true' && success()
        run: |
          echo "✅ Deployment berhasil!"
          echo "Commit : ${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "Actor  : ${{ github.actor }}"

      - name: Deployment di-skip (secrets belum ada)
        if: steps.secrets_check.outputs.configured == 'false'
        run: |
          echo "ℹ️  Deployment di-skip — secrets belum dikonfigurasi."
          echo "Ini normal jika hosting belum dibeli."
          echo "Pre-deploy validation sudah lulus ✅"
          exit 0
