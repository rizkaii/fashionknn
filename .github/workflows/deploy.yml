name: Deploy to ArenHost

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # Izinkan deploy manual dari tab Actions GitHub

jobs:
  # ============================================================
  # JOB 1: Validasi sebelum deploy
  # ============================================================
  pre-deploy-check:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring, json
          coverage: none

      - name: Lint PHP syntax
        run: |
          echo "=== PHP Lint sebelum deploy ==="
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find app/ public/ -name "*.php" -print0)
          if [ -f "migrate.php" ]; then
            if ! php -l migrate.php > /dev/null 2>&1; then
              php -l migrate.php
              ERRORS=$((ERRORS+1))
            fi
          fi
          if [ $ERRORS -gt 0 ]; then
            echo "ERROR: $ERRORS file PHP memiliki syntax error. Deploy dibatalkan."
            exit 1
          fi
          echo "=== Semua file PHP valid ==="

      - name: Pastikan .env tidak ter-commit
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: File .env ditemukan di repository. Deploy dibatalkan."
            echo "Jalankan: git rm --cached .env"
            exit 1
          fi
          echo "[OK] .env tidak ada di repository"

  # ============================================================
  # JOB 2: Deploy via SSH ke ArenHost
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deploy-check  # Hanya deploy jika pre-check berhasil
    environment: production   # Gunakan environment GitHub untuk proteksi tambahan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.HOST }}
          username:    ${{ secrets.USERNAME }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          port:        ${{ secrets.PORT }}
          script_stop: true   # Hentikan jika ada perintah yang gagal

          script: |
            echo "=== Memulai Deployment ==="
            echo "Waktu: $(date)"
            echo "Host: $(hostname)"

            # Navigasi ke direktori project
            cd /home/${{ secrets.USERNAME }}/fashiontrendknn || {
              echo "ERROR: Direktori project tidak ditemukan!"
              echo "Pastikan path /home/${{ secrets.USERNAME }}/fashiontrendknn sudah benar."
              exit 1
            }

            echo "=== Direktori aktif: $(pwd) ==="

            # Pastikan ini adalah git repository yang valid
            if [ ! -d ".git" ]; then
              echo "ERROR: Bukan git repository. Jalankan git clone terlebih dahulu."
              exit 1
            fi

            # Periksa status git
            echo "=== Status Git ==="
            git status --short

            # Ambil update dari remote (fetch saja, belum merge)
            echo "=== Git Fetch ==="
            git fetch origin main

            # Gunakan ff-only untuk mencegah merge yang tidak diinginkan
            # Jika ada konflik, deployment akan gagal (aman)
            echo "=== Git Pull (ff-only) ==="
            git pull --ff-only origin main || {
              echo "ERROR: git pull --ff-only gagal."
              echo "Mungkin ada perubahan lokal di server yang konflik."
              echo "Periksa server secara manual."
              exit 1
            }

            echo "=== Commit terbaru ==="
            git log -1 --pretty=format:"Commit: %H%nAuthor: %an%nDate:   %ai%nMessage: %s"

            # Pastikan .env ada (tidak ikut git)
            if [ ! -f ".env" ]; then
              echo "WARNING: File .env tidak ditemukan di server!"
              echo "Buat file .env dari .env.example dan isi dengan konfigurasi production."
              echo "  cp .env.example .env && nano .env"
              exit 1
            fi

            # Pastikan storage/logs ada dan writable
            mkdir -p storage/logs
            mkdir -p storage/uploads
            chmod 755 storage/logs
            chmod 755 storage/uploads

            # Periksa apakah ada migration baru yang perlu dijalankan
            # (opsional — jalankan manual jika migration mengubah schema)
            # php migrate.php

            echo ""
            echo "=== Deployment Selesai ==="
            echo "URL: Periksa domain Anda"
            echo "Waktu: $(date)"

      - name: Notify deployment success
        if: success()
        run: |
          echo "Deployment ke production berhasil!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor:  ${{ github.actor }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Deployment GAGAL!"
          echo "Periksa log di atas untuk detail error."
          echo "Commit: ${{ github.sha }}"
