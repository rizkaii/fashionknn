name: Deploy to Production

# ============================================================
# Trigger: jalankan otomatis saat push ke branch main
# Juga bisa dijalankan manual dari tab Actions GitHub
# ============================================================
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Validasi kode sebelum deploy
  # Memastikan tidak ada syntax error PHP yang masuk ke server
  # ============================================================
  pre-deploy-check:
    name: Validasi PHP Sebelum Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring, json, fileinfo
          coverage: none

      - name: Periksa syntax PHP — app/
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "SYNTAX ERROR: $file"
              php -l "$file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find app/ -name "*.php" -print0)
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS file PHP di app/ memiliki syntax error. Deploy dibatalkan."
            exit 1
          fi
          echo "✅ app/ — semua file PHP valid"

      - name: Periksa syntax PHP — public/
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "SYNTAX ERROR: $file"
              php -l "$file"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find public/ -name "*.php" -print0)
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS file PHP di public/ memiliki syntax error. Deploy dibatalkan."
            exit 1
          fi
          echo "✅ public/ — semua file PHP valid"

      - name: Periksa syntax PHP — file root
        run: |
          for f in migrate.php config.php; do
            if [ -f "$f" ]; then
              if ! php -l "$f" > /dev/null 2>&1; then
                echo "SYNTAX ERROR: $f"
                php -l "$f"
                exit 1
              fi
            fi
          done
          echo "✅ Root PHP files — valid"

      - name: Pastikan .env tidak ter-commit
        run: |
          if [ -f ".env" ]; then
            echo "❌ File .env ditemukan di repository!"
            echo "   Jalankan: git rm --cached .env && git commit -m 'remove .env'"
            exit 1
          fi
          echo "✅ .env tidak ada di repository"

      - name: Validasi file penting tersedia
        run: |
          REQUIRED=(
            "app/config/database.php"
            "app/config/env.php"
            "app/helpers/auth.php"
            "app/helpers/functions.php"
            "app/middleware/access.php"
            "app/services/KNNService.php"
            "app/views/layouts/header.php"
            "app/views/layouts/footer.php"
            "public/index.php"
            "public/.htaccess"
            "database/database.sql"
            "migrate.php"
            ".env.example"
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "❌ $MISSING file penting tidak ditemukan. Deploy dibatalkan."
            exit 1
          fi
          echo "✅ Semua file penting tersedia"

  # ============================================================
  # JOB 2: Deploy ke VPS via SSH
  # Hanya berjalan setelah Job 1 berhasil (needs: pre-deploy-check)
  # ============================================================
  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:        ${{ secrets.HOST }}
          port:        ${{ secrets.PORT }}
          username:    ${{ secrets.USERNAME }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true

          # ==================================================
          # KONFIGURASI YANG PERLU DISESUAIKAN:
          # Ganti /path/to/your/project dengan path
          # direktori project di VPS Anda.
          # Contoh: /home/username/fashiontrendknn
          #         /var/www/html/fashiontrendknn
          # ==================================================
          script: |
            set -e

            PROJECT_DIR="/home2/trendfas/fashiontrendknn"

            echo "========================================"
            echo "  FashionTrendKNN — Deployment"
            echo "  Waktu  : $(date '+%Y-%m-%d %H:%M:%S')"
            echo "  Server : $(hostname)"
            echo "========================================"

            # ---- 1. Navigasi ke direktori project ----
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "❌ Direktori project tidak ditemukan: $PROJECT_DIR"
              echo "   Pastikan sudah menjalankan git clone pertama kali:"
              echo "   git clone <repo-url> $PROJECT_DIR"
              exit 1
            fi
            cd "$PROJECT_DIR"
            echo "📁 Direktori: $(pwd)"

            # ---- 2. Validasi git repository ----
            if [ ! -d ".git" ]; then
              echo "❌ Bukan git repository yang valid."
              echo "   Jalankan git clone terlebih dahulu."
              exit 1
            fi

            # ---- 3. Pastikan .env ada di server ----
            if [ ! -f ".env" ]; then
              echo "❌ File .env tidak ditemukan di server!"
              echo "   Buat dari template: cp .env.example .env"
              echo "   Lalu isi konfigurasi database dan APP_URL."
              exit 1
            fi

            # ---- 4. Git fetch & pull (ff-only, tidak hapus apapun) ----
            echo ""
            echo "--- Git Update ---"
            git fetch origin main

            git pull --ff-only origin main || {
              echo "❌ git pull --ff-only gagal."
              echo "   Ada perubahan lokal di server yang konflik dengan remote."
              echo "   Periksa server secara manual: git status"
              exit 1
            }

            echo "📌 Commit aktif:"
            git log -1 --pretty=format:"   Hash    : %H%n   Author  : %an%n   Tanggal : %ai%n   Pesan   : %s"
            echo ""

            # ---- 5. Pastikan folder storage ada dan writable ----
            mkdir -p storage/logs
            mkdir -p storage/uploads
            chmod 755 storage/logs
            chmod 755 storage/uploads
            echo "📂 Folder storage siap"

            # ---- 6. PHP: tidak ada build step ----
            # Project ini PHP Native — tidak memerlukan composer install,
            # npm build, atau proses kompilasi apapun.
            echo "🐘 PHP Native project — tidak ada build step"

            echo ""
            echo "========================================"
            echo "  ✅ Deployment Selesai"
            echo "  Waktu : $(date '+%Y-%m-%d %H:%M:%S')"
            echo "========================================"

      - name: Ringkasan deployment
        run: |
          echo "✅ Deploy berhasil!"
          echo ""
          echo "Detail:"
          echo "  Repository : ${{ github.repository }}"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Triggered  : ${{ github.actor }}"
          echo "  Waktu      : $(date '+%Y-%m-%d %H:%M:%S UTC')"
